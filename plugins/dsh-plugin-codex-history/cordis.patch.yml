# DeepSeek Harness load layer for this plugin.
#
# The `insert` list appends a row to the booted profile's entry tree. `id` is
# this row's stable identity in that tree; `name` is the module specifier the
# loader imports. The two need not match.
#
# Registered at the host plane rather than an agent-preset plane: the tool
# visibility resolver seeds inheritance from the host-plane tool entries, so a
# host-plane insert reaches every agent and every preset.
#
# The plugin is read-only. It never writes to either home.
- insert:
    - id: codex-history
      name: '@codex-to-dsh/dsh-plugin-codex-history'
      config:
        maxResults: 20
